# Optional documentation of recommended APPSECRET keys (NOT a CI deploy gate).
# Sync writes the full APPSECRET Variable body to env/<service>.env.
# Deploy only checks that the env file exists and is non-empty.
#
# For mail-service, include MAIL_DATABASE_URL pointing at managed DB mail_forex_geo
# (schema mail), e.g. postgresql+asyncpg://user:pass@PRIVATE_HOST:25060/mail_forex_geo?options=-csearch_path%3Dmail

mail-service:
  - APP_NAME
  - SMTP2GO_ADMIN_USERNAME
  - SMTP2GO_ADMIN_PASSWORD
  - GMAIL_APP_USER
  - GMAIL_APP_PASSWORD
  - ELASTIC_EMAIL_API_KEY
  - MAILERSEND_API_KEY
  - MAIL_DATABASE_URL
