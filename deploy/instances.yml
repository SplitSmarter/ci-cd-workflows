defaults:
  ssh_user: deploy
  deploy_path: /opt/splitsmarter
  registry: ghcr.io/splitsmarter

# branch → env key (same profiles as Expo)
branch_map:
  refs/heads/main: production
  refs/heads/release: production
  refs/heads/qa: qa
  refs/heads/test: testing
  # everything else → development

# GitHub Variable naming: {ENV}_{TYPE}_{REST}
#   INSTANCE → DEVELOPMENT_INSTANCE_1 (API) / DEVELOPMENT_INSTANCE_2 (main-website)
#   APPSECRET → DEVELOPMENT_APPSECRET_MAILSERVICE / DEVELOPMENT_APPSECRET_GATEWAY
instances:
  development:
    targets:
      - id: 1
      - id: 2
    services:
      mail-service:
        target_ids: [1]
        compose_service: mail-service
        image_name: mail-service
        container_port: 8083
        health_path: /health
        edge_path: /mail
      forex-services:
        target_ids: [1]
        compose_service: forex-services
        image_name: forex-services
        container_port: 8093
        health_path: /health
        edge_path: /forex
      gateway:
        target_ids: [1]
        compose_service: gateway
        image_name: gateway
        container_port: 8080
        health_path: /health
        edge_path: /
      alloy:
        target_ids: [1]
        compose_service: alloy
        image_name: alloy
        container_port: 12345
        health_path: /-/ready
      main-website:
        target_ids: [2]
        compose_service: main-website
        image_name: main-website
        container_port: 8084
        health_path: /health
        edge_path: /
