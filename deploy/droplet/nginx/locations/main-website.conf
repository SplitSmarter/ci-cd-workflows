# Public site → main-website on 127.0.0.1:8084.
# Install only with EDGE_PROFILE=site. Do not combine with gateway.conf (both claim /).
location / {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare sends the visitor scheme. $scheme here is http, because the
    # orange-cloud proxy connects to this port-80 origin.
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = "") {
        set $forwarded_proto $scheme;
    }
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}
