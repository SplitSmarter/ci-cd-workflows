# Installed by bootstrap to /etc/nginx/sites-available/splitsmarter
# Path routes → localhost container ports (containers stay on 127.0.0.1 only).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Per-service location snippets (e.g. mail-service.conf → /mail/)
    include /etc/nginx/splitsmarter.d/*.conf;

    location = / {
        default_type text/plain;
        return 200 'splitsmarter edge (nginx)\n';
    }
}
