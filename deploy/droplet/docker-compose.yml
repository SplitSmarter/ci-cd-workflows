services:
  mail-service:
    image: ${MAIL_IMAGE:-ghcr.io/splitsmarter/mail-service:production}
    env_file: .env
    ports:
      - "127.0.0.1:8083:8083"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
