services:
  mail-service:
    image: ${MAIL_IMAGE:-ghcr.io/splitsmarter/mail-service:production}
    env_file: env/mail-service.env
    ports:
      - "127.0.0.1:8083:8083"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  forex-services:
    image: ${FOREX_IMAGE:-ghcr.io/splitsmarter/forex-services:production}
    env_file: env/forex-services.env
    ports:
      - "127.0.0.1:8093:8093"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8093/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/splitsmarter/gateway:production}
    env_file: env/gateway.env
    environment:
      # 512MB droplets: keep heap small (mail-service may share the host)
      JAVA_TOOL_OPTIONS: ${GATEWAY_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=40.0 -Xms64m -Xmx192m}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

  main-website:
    image: ${MAIN_WEBSITE_IMAGE:-ghcr.io/splitsmarter/main-website:production}
    env_file: env/main-website.env
    volumes:
      - ./guide:/usr/share/nginx/html/guide:ro
    ports:
      - "127.0.0.1:8084:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  alloy:
    image: grafana/alloy:latest
    env_file: env/alloy.env
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

