services:
  mail-service:
    image: ${MAIL_IMAGE:-ghcr.io/splitsmarter/mail-service:production}
    env_file: env/mail-service.env
    ports:
      - "127.0.0.1:8083:8083"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/splitsmarter/gateway:production}
    env_file: env/gateway.env
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
