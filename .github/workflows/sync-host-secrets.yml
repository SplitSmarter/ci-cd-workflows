name: Sync Host Secrets

on:
  workflow_call:
    inputs:
      environment:
        description: Logical env (development, qa, testing, production)
        required: true
        type: string
      service_name:
        description: Service whose APPSECRET payload to sync
        required: false
        type: string
        default: mail-service
      instance_id:
        description: Optional single instance id (default all targets for env)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      environment:
        description: Logical env
        required: true
        type: choice
        options:
          - development
          - qa
          - testing
          - production
      service_name:
        description: Service name
        required: true
        type: string
        default: mail-service
      instance_id:
        description: Optional instance id (blank = all)
        required: false
        type: string
        default: ""

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
      service_name: ${{ steps.resolve.outputs.service_name }}
      appsecret_name: ${{ steps.resolve.outputs.appsecret_name }}
      deploy_path: ${{ steps.resolve.outputs.deploy_path }}
      instance_names: ${{ steps.resolve.outputs.instance_names }}
      target_ids: ${{ steps.resolve.outputs.target_ids }}
    steps:
      - name: Checkout ci-cd-workflows
        uses: actions/checkout@v4
        with:
          repository: SplitSmarter/ci-cd-workflows
          ref: ${{ github.repository == 'SplitSmarter/ci-cd-workflows' && github.sha || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Resolve targets
        id: resolve
        run: |
          python deploy/scripts/resolve_target.py \
            --inventory deploy/instances.yml \
            --environment "${{ inputs.environment }}" \
            --service-name "${{ inputs.service_name }}" \
            --instance-id "${{ inputs.instance_id }}" \
            --github-output

  sync:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance_name: ${{ fromJson(needs.resolve.outputs.instance_names) }}
    env:
      # Inject known INSTANCE / APPSECRET Variables (extend as you add instances)
      DEVELOPMENT_INSTANCE_1: ${{ vars.DEVELOPMENT_INSTANCE_1 }}
      QA_INSTANCE_1: ${{ vars.QA_INSTANCE_1 }}
      TESTING_INSTANCE_1: ${{ vars.TESTING_INSTANCE_1 }}
      PRODUCTION_INSTANCE_1: ${{ vars.PRODUCTION_INSTANCE_1 }}
      PRODUCTION_INSTANCE_2: ${{ vars.PRODUCTION_INSTANCE_2 }}
      DEVELOPMENT_APPSECRET_MAILSERVICE: ${{ vars.DEVELOPMENT_APPSECRET_MAILSERVICE }}
      QA_APPSECRET_MAILSERVICE: ${{ vars.QA_APPSECRET_MAILSERVICE }}
      TESTING_APPSECRET_MAILSERVICE: ${{ vars.TESTING_APPSECRET_MAILSERVICE }}
      PRODUCTION_APPSECRET_MAILSERVICE: ${{ vars.PRODUCTION_APPSECRET_MAILSERVICE }}
    steps:
      - name: Checkout ci-cd-workflows
        uses: actions/checkout@v4
        with:
          repository: SplitSmarter/ci-cd-workflows
          ref: ${{ github.repository == 'SplitSmarter/ci-cd-workflows' && github.sha || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Prepare payloads
        id: payloads
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh deploy/droplet/*.sh
          mkdir -p /tmp/deploy-payloads
          INSTANCE_NAME="${{ matrix.instance_name }}"
          APPSECRET_NAME="${{ needs.resolve.outputs.appsecret_name }}"
          SERVICE_NAME="${{ needs.resolve.outputs.service_name }}"
          ./deploy/scripts/load_payload.sh "$INSTANCE_NAME" /tmp/deploy-payloads/instance.env
          ./deploy/scripts/load_payload.sh "$APPSECRET_NAME" /tmp/deploy-payloads/appsecret.env

          mapfile -t KEYS < <(python -c "import yaml; from pathlib import Path; data=yaml.safe_load(Path('deploy/required-secrets.yml').read_text()); print('\\n'.join(data.get('${SERVICE_NAME}', [])))")
          # shellcheck source=deploy/scripts/parse_kv.sh
          source deploy/scripts/parse_kv.sh
          filter_kv_keys "${KEYS[@]}" < /tmp/deploy-payloads/appsecret.env > /tmp/deploy-payloads/appsecret.filtered.env
          if [[ ! -s /tmp/deploy-payloads/appsecret.filtered.env ]]; then
            echo "ERROR: filtered APPSECRET payload is empty" >&2
            exit 1
          fi

      - name: Sync .env to droplet
        run: |
          set -euo pipefail
          DEPLOY_PATH="${{ needs.resolve.outputs.deploy_path }}"
          SERVICE_NAME="${{ needs.resolve.outputs.service_name }}"
          # shellcheck source=deploy/scripts/parse_kv.sh
          source deploy/scripts/parse_kv.sh
          parse_kv_file /tmp/deploy-payloads/instance.env
          : "${SSH_HOST:?}"
          : "${SSH_USER:=deploy}"
          : "${SSH_PORT:=22}"
          : "${SSH_KEY:?}"
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SSH_OPTS=(-i "$KEY_FILE" -o Port="$SSH_PORT" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts_deploy)

          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}/scripts'"
          scp "${SSH_OPTS[@]}" deploy/droplet/sync-env.sh deploy/droplet/validate-env.sh \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/scripts/"

          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "export DEPLOY_PATH='${DEPLOY_PATH}'; chmod +x '${DEPLOY_PATH}/scripts/sync-env.sh' '${DEPLOY_PATH}/scripts/validate-env.sh'; '${DEPLOY_PATH}/scripts/sync-env.sh'" \
            < /tmp/deploy-payloads/appsecret.filtered.env

          KEYS=$(python -c "import yaml; from pathlib import Path; data=yaml.safe_load(Path('deploy/required-secrets.yml').read_text()); print(' '.join(data.get('${SERVICE_NAME}', [])))")
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "export DEPLOY_PATH='${DEPLOY_PATH}'; '${DEPLOY_PATH}/scripts/validate-env.sh' ${KEYS}"

          rm -f "$KEY_FILE"
