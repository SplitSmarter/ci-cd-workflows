name: Sync Host Secrets

on:
  workflow_call:
    inputs:
      environment:
        description: Logical env (development, qa, testing, production)
        required: true
        type: string
      service_name:
        description: Service whose APPSECRET payload to sync
        required: false
        type: string
        default: mail-service
      instance_id:
        description: Optional single instance id (default all targets for env)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      environment:
        description: Logical env
        required: true
        type: choice
        options:
          - development
          - qa
          - testing
          - production
      service_name:
        description: Service name
        required: true
        type: string
        default: mail-service
      instance_id:
        description: Optional instance id (blank = all)
        required: false
        type: string
        default: ""

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
      service_name: ${{ steps.resolve.outputs.service_name }}
      appsecret_name: ${{ steps.resolve.outputs.appsecret_name }}
      deploy_path: ${{ steps.resolve.outputs.deploy_path }}
      instance_names: ${{ steps.resolve.outputs.instance_names }}
      target_ids: ${{ steps.resolve.outputs.target_ids }}
    steps:
      - name: Checkout ci-cd-workflows
        uses: actions/checkout@v4
        with:
          repository: SplitSmarter/ci-cd-workflows
          ref: ${{ github.repository == 'SplitSmarter/ci-cd-workflows' && github.sha || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Resolve targets
        id: resolve
        run: |
          python deploy/scripts/resolve_target.py \
            --inventory deploy/instances.yml \
            --environment "${{ inputs.environment }}" \
            --service-name "${{ inputs.service_name }}" \
            --instance-id "${{ inputs.instance_id }}" \
            --github-output

  sync:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance_name: ${{ fromJson(needs.resolve.outputs.instance_names) }}
    env:
      # Inject known INSTANCE / APPSECRET Variables (extend as you add instances)
      DEVELOPMENT_INSTANCE_1: ${{ vars.DEVELOPMENT_INSTANCE_1 }}
      QA_INSTANCE_1: ${{ vars.QA_INSTANCE_1 }}
      TESTING_INSTANCE_1: ${{ vars.TESTING_INSTANCE_1 }}
      PRODUCTION_INSTANCE_1: ${{ vars.PRODUCTION_INSTANCE_1 }}
      PRODUCTION_INSTANCE_2: ${{ vars.PRODUCTION_INSTANCE_2 }}
      DEVELOPMENT_APPSECRET_MAILSERVICE: ${{ vars.DEVELOPMENT_APPSECRET_MAILSERVICE }}
      QA_APPSECRET_MAILSERVICE: ${{ vars.QA_APPSECRET_MAILSERVICE }}
      TESTING_APPSECRET_MAILSERVICE: ${{ vars.TESTING_APPSECRET_MAILSERVICE }}
      PRODUCTION_APPSECRET_MAILSERVICE: ${{ vars.PRODUCTION_APPSECRET_MAILSERVICE }}
    steps:
      - name: Checkout ci-cd-workflows
        uses: actions/checkout@v4
        with:
          repository: SplitSmarter/ci-cd-workflows
          ref: ${{ github.repository == 'SplitSmarter/ci-cd-workflows' && github.sha || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Prepare payloads
        id: payloads
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh deploy/droplet/*.sh
          mkdir -p /tmp/deploy-payloads
          INSTANCE_NAME="${{ matrix.instance_name }}"
          APPSECRET_NAME="${{ needs.resolve.outputs.appsecret_name }}"
          SERVICE_NAME="${{ needs.resolve.outputs.service_name }}"
          echo "==> loading INSTANCE_NAME=${INSTANCE_NAME} APPSECRET_NAME=${APPSECRET_NAME} SERVICE_NAME=${SERVICE_NAME}"
          ./deploy/scripts/load_payload.sh "$INSTANCE_NAME" /tmp/deploy-payloads/instance.env
          ./deploy/scripts/load_payload.sh "$APPSECRET_NAME" /tmp/deploy-payloads/appsecret.env
          # Write full APPSECRET body (no required-secrets key filter)
          if [[ ! -s /tmp/deploy-payloads/appsecret.env ]]; then
            echo "ERROR: APPSECRET payload ${APPSECRET_NAME} is empty" >&2
            exit 1
          fi
          echo "==> APPSECRET payload lines=$(wc -l < /tmp/deploy-payloads/appsecret.env)"

      - name: Sync env file to droplet
        run: |
          set -euo pipefail
          DEPLOY_PATH="${{ needs.resolve.outputs.deploy_path }}"
          SERVICE_NAME="${{ needs.resolve.outputs.service_name }}"
          # shellcheck source=deploy/scripts/prepare_ssh.sh
          source deploy/scripts/prepare_ssh.sh
          prepare_ssh /tmp/deploy-payloads/instance.env
          prepare_ssh_verify_connectivity
          remote_mkdir_deploy "$DEPLOY_PATH"

          echo "==> copying host scripts"
          scp "${SSH_OPTS[@]}" \
            deploy/droplet/sync-env.sh \
            deploy/droplet/validate-env.sh \
            deploy/droplet/check-host.sh \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/scripts/" \
            || { echo "ERROR: scp of host scripts failed" >&2; exit 1; }

          echo "==> writing ${DEPLOY_PATH}/env/${SERVICE_NAME}.env"
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "export DEPLOY_PATH='${DEPLOY_PATH}'; \
             chmod +x '${DEPLOY_PATH}/scripts/sync-env.sh' '${DEPLOY_PATH}/scripts/validate-env.sh' '${DEPLOY_PATH}/scripts/check-host.sh'; \
             '${DEPLOY_PATH}/scripts/sync-env.sh' '${SERVICE_NAME}'" \
            < /tmp/deploy-payloads/appsecret.env \
            || { echo "ERROR: sync-env.sh failed on remote host" >&2; exit 1; }

          echo "==> checking secrets file present (no per-key list)"
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "export DEPLOY_PATH='${DEPLOY_PATH}'; '${DEPLOY_PATH}/scripts/validate-env.sh' '${SERVICE_NAME}'" \
            || { echo "ERROR: env/${SERVICE_NAME}.env missing or empty after sync" >&2; exit 1; }

          echo "ok secrets synced for INSTANCE_NAME=${{ matrix.instance_name }} SERVICE_NAME=${SERVICE_NAME} (Docker not required for sync)"
